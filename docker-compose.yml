services:
  # Optional: the app auto-falls back to a built-in in-memory cache when
  # REDIS_URL is empty/unreachable, so this service is a dev convenience only.
  redis:
    image: redis:7-alpine
    container_name: gyansetu_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gyansetu_app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
  uploads_data:
  outputs_data:

