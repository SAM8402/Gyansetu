services:
  # ONE compose file for both deployment modes:
  #
  #   Free deploy (default):  docker compose up -d --build
  #     -> app only, NO Redis. The app auto-falls back to built-in fakeredis
  #        (with a dependency-free InMemoryRedis fallback) when REDIS_URL is
  #        empty. Single worker is required for in-memory pub/sub (SSE
  #        progress) - the default command already runs with --workers 1.
  #
  #   Dev with Redis:         REDIS_URL=redis://redis:6379/0 docker compose --profile dev up -d --build
  #     -> additionally starts the redis service below (dev convenience only).

  redis:
    profiles: ["dev"]
    image: redis:7-alpine
    container_name: gyansetu_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gyansetu_app
    ports:
      - "8000:8000"
    env_file:
      # Optional: backend/.env is gitignored (secrets) and absent in CI.
      # Compose skips it when missing; env vars fall back to defaults or the
      # --profile dev REDIS_URL override (see header comment).
      - path: ./backend/.env
        required: false
    environment:
      - PORT=8000
      - REDIS_URL=${REDIS_URL:-}
    depends_on:
      redis:
        condition: service_healthy
        required: false
    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
      - outputs_data:/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
  chroma_data:
  uploads_data:
  outputs_data:
