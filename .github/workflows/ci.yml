name: Continuous Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel outdated workflow runs for the same branch automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint & Pytest Suite
    runs-on: ubuntu-latest

    # No external services: tests run on the built-in fakeredis/in-memory
    # backend, matching free deployments (no Redis required).
    env:
      SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
      GOOGLE_API_KEY: ci-mock-key-1,ci-mock-key-2
      GEMINI_MODEL: gemini-2.0-flash
      LLM_FALLBACK_CHAIN: gemini-2.0-flash,gemini-1.5-flash
      DATABASE_URL: sqlite+aiosqlite:///./ci_test.db
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio flake8

      - name: Run Python Code Quality Check (Flake8)
        working-directory: backend
        run: |
          # Check for syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Pytest Suite
        working-directory: backend
        run: |
          pytest -v --tb=short -W ignore::DeprecationWarning -W ignore::PendingDeprecationWarning

  frontend:
    name: Frontend Tests & Asset Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Vitest Unit Tests
        working-directory: frontend
        run: npm run test

      - name: Build Production Assets (Vite)
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker Container Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose File
        run: docker compose config --quiet

      - name: Validate Multi-Stage Docker Compose Build
        run: docker compose build


